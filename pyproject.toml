
[project]
name = "trace"
version = "0.1.0"
description = "Trace content table"
readme = "README.md"
requires-python = ">=3.8,<3.11"
dependencies = [
    "python-dotenv==1.0.1",
    "fastapi==0.115.0",
    "opencv-python==4.7.0.72",
    "pdf2image==1.16.3",
    "pillow==9.5.0",
    "polygon3==3.0.9.1",
    "pretrainedmodels==0.7.4",
    "scikit-image==0.19.3",
    "scipy==1.7.3",
    "torch==1.12.0",
    "torchvision==0.13.0",
    "shapely==2.0.1",
    "tensorboardx==2.6",
    "uvicorn",
    "xlsxwriter==3.0.9",
    "six==1.17.0",
    "requests==2.32.3",
    "python-multipart",
    "gradio>=4.44.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
